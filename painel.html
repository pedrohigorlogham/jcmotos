<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - JC Motos</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #0c0b0b; color: #f4f4f5; font-family: Arial, sans-serif; }
        .topo { min-height: 100px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; background: #101010; border-bottom: 1px solid #27272a; }
        .topo a { color: #f4f4f5; text-decoration: none; margin-left: 20px; }
        .container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        .card { background: #141414; padding: 24px; border-radius: 8px; border: 1px solid #27272a; margin-bottom: 24px; }
        h1, h2 { margin-top: 0; }
        form { display: flex; flex-direction: column; gap: 16px; margin-bottom: 30px; }
        label { font-weight: bold; font-size: 14px; }
        input[type="text"], input[type="file"] { width: 100%; padding: 10px; background: #27272a; border: 1px solid #3f3f46; color: #fff; border-radius: 4px; }
        button[type="submit"] { background: #800d0d; color: #fff; border: none; padding: 12px; font-weight: bold; cursor: pointer; border-radius: 4px; }
        button[type="submit"]:hover { background: #a11212; }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #27272a; vertical-align: middle; }
        th { background: #1f1f23; }
        img.thumb { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; }
        .btn-delete { background: #dc2626; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-delete:hover { background: #ef4444; }
    </style>
</head>
<body>

    <header class="topo">
        <a href="/"><img src="logo.png" alt="JC Motos" height="40"></a>
        <a href="/catalogo.html">Ver catálogo ➔</a>
    </header>

    <main class="container">
        <section id="areaAdmin" class="card">
            <h1>Produtos do catálogo</h1>
            <p>Cadastre capacetes manualmente. Assim que salvar, o produto aparecerá automaticamente no site do cliente.</p>

            <h2>Adicionar capacete</h2>
            <form id="formProduto">
                <input type="hidden" id="idProduto">

                <div>
                    <label for="nomeProduto">Marca / Modelo do Capacete:</label>
                    <input type="text" id="nomeProduto" placeholder="Ex: Capacete Pro Tork Evolution" required>
                </div>

                <div>
                    <label for="precoProduto">Preço (R$):</label>
                    <input type="text" id="precoProduto" placeholder="Ex: 250,00" required>
                </div>

                <div>
                    <label for="imagemProduto">Foto do Capacete:</label>
                    <input type="file" id="imagemProduto" accept="image/*" required>
                </div>

                <button type="submit">Salvar Item no Catálogo</button>
            </form>

            <h2>Produtos cadastrados</h2>
            <div class="tabela-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Imagem</th>
                            <th>Marca / Modelo</th>
                            <th>Preço</th>
                            <th style="text-align: center;">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="corpoTabela">
                        <tr><td colspan="4" style="text-align:center;">Carregando produtos...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        const API = window.location.hostname === 'localhost' ? 'http://localhost:3000/api' : '/api';

        document.addEventListener('DOMContentLoaded', function() {
            const formProduto = document.getElementById('formProduto');
            if (formProduto) {
                formProduto.addEventListener('submit', salvarProduto);
            }
            carregarProdutos();
        });

        // Buscar e exibir produtos cadastrados
        async function carregarProdutos() {
            const corpoTabela = document.getElementById('corpoTabela');
            try {
                const resposta = await fetch(`${API}/produtos`);
                const produtos = await resposta.json();

                if (!Array.isArray(produtos) || produtos.length === 0) {
                    corpoTabela.innerHTML = '<tr><td colspan="4" style="text-align:center;">Nenhum produto cadastrado.</td></tr>';
                    return;
                }

                corpoTabela.innerHTML = produtos.map(p => `
                    <tr>
                        <td><img src="${p.imagem_url}" class="thumb" alt="${p.nome}"></td>
                        <td>${p.nome}</td>
                        <td>R$ ${p.preco}</td>
                        <td style="text-align: center;">
                            <button class="btn-delete" onclick="excluirProduto('${p.id}')">Excluir</button>
                        </td>
                    </tr>
                `).join('');
            } catch (erro) {
                console.error(erro);
                corpoTabela.innerHTML = '<tr><td colspan="4" style="text-align:center; color:red;">Erro ao carregar itens do banco de dados.</td></tr>';
            }
        }

        // Enviar novo produto para o backend
        async function salvarProduto(e) {
            e.preventDefault();

            const nome = document.getElementById('nomeProduto').value;
            const preco = document.getElementById('precoProduto').value;
            const imagemInput = document.getElementById('imagemProduto');

            if (!imagemInput.files || imagemInput.files.length === 0) {
                return alert('Por favor, selecione uma foto para o capacete.');
            }

            try {
                const imagemBase64 = await converterParaBase64(imagemInput.files[0]);

                const resposta = await fetch(`${API}/produtos`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome, preco, imagem: imagemBase64 })
                });

                const resultado = await resposta.json();

                if (resposta.ok) {
                    alert('Capacete cadastrado com sucesso!');
                    document.getElementById('formProduto').reset();
                    carregarProdutos();
                } else {
                    alert(resultado.error || 'Erro ao tentar salvar o item.');
                }
            } catch (erro) {
                console.error(erro);
                alert('Erro de comunicação com o servidor ao salvar.');
            }
        }

        // Função para excluir produto
        async function excluirProduto(id) {
            if (!confirm('Tem certeza que deseja excluir este produto do catálogo?')) return;

            try {
                const resposta = await fetch(`${API}/produtos/${id}`, {
                    method: 'DELETE'
                });

                if (resposta.ok) {
                    alert('Produto excluído com sucesso!');
                    carregarProdutos();
                } else {
                    const resultado = await resposta.json();
                    alert(resultado.error || 'Erro ao excluir o produto.');
                }
            } catch (erro) {
                console.error(erro);
                alert('Erro de comunicação ao tentar excluir.');
            }
        }

        // Converter arquivo de imagem em Base64
        function converterParaBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Digital - JC Motos</title>
    <!-- Ícones do FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #09090b;
            color: #f4f4f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
        }

        /* Cabeçalho */
        header {
            background-color: #000000;
            border-bottom: 4px solid #dc2626;
            position: sticky;
            top: 0;
            z-index: 50;
            width: 100%;
        }
        .nav-container {
            max-width: 1320px;
            margin: 0 auto;
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo-link {
            display: flex;
            align-items: center;
            text-decoration: none;
        }
        .logo-img {
            height: 60px;
            width: auto;
        }
        .nav-menu {
            display: flex;
            gap: 36px;
        }
        @media (max-width: 768px) {
            .nav-menu { display: none; }
        }
        .nav-menu a {
            color: #f4f4f5;
            text-decoration: none;
            font-size: 18px;
            font-weight: 700;
            transition: color 0.2s;
        }
        .nav-menu a:hover {
            color: #ef4444;
        }

        /* Hero do Catálogo */
        .catalogo-hero {
            background-color: #18181b;
            padding: 60px 16px 40px;
            text-align: center;
            border-bottom: 1px solid #27272a;
        }
        .catalogo-hero h1 {
            font-size: 36px;
            font-weight: 900;
            margin-bottom: 8px;
        }
        .catalogo-hero h1 span {
            color: #dc2626;
        }
        .catalogo-hero p {
            color: #a1a1aa;
            font-size: 16px;
        }

        /* Grid do Catálogo */
        .catalogo-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 16px;
        }
        .produtos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 24px;
        }
        .produto-card {
            background-color: #18181b;
            border: 1px solid #27272a;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, border-color 0.2s;
        }
        .produto-card:hover {
            transform: translateY(-5px);
            border-color: #dc2626;
        }
        .produto-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background-color: #27272a;
        }
        .produto-info {
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }
        .produto-nome {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
        }
        .produto-preco {
            font-size: 20px;
            font-weight: 800;
            color: #ef4444;
            margin-bottom: 16px;
        }
        .btn-comprar {
            background-color: #10b981;
            color: #ffffff;
            text-decoration: none;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background-color 0.2s;
        }
        .btn-comprar:hover {
            background-color: #059669;
        }
        .mensagem-status {
            text-align: center;
            grid-column: 1 / -1;
            padding: 40px 0;
            color: #a1a1aa;
            font-size: 18px;
        }

        /* Paginação Estilizada */
        .paginacao-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            margin-top: 40px;
        }
        .btn-pagina {
            background-color: #18181b;
            color: #ffffff;
            border: 1px solid #27272a;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-pagina:hover:not(:disabled) {
            background-color: #dc2626;
            border-color: #dc2626;
        }
        .btn-pagina:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .info-pagina {
            color: #a1a1aa;
            font-weight: 700;
            font-size: 15px;
        }

        /* Rodapé */
        footer {
            background-color: #000000;
            border-top: 1px solid #27272a;
            padding: 40px 16px;
            text-align: center;
            color: #71717a;
            font-size: 14px;
            margin-top: 60px;
        }
    </style>
</head>
<body>

    <!-- CABEÇALHO -->
    <header>
        <div class="nav-container">
            <a href="index.html" class="logo-link">
                <img src="logo.png" alt="JC Motos Logo" class="logo-img">
            </a>
            
            <nav class="nav-menu">
                <a href="index.html#inicio">Início</a>
                <a href="index.html#servicos">Serviços</a>
                <a href="catalogo.html" style="color: #ef4444;">Catálogo</a>
                <a href="index.html#contato">Contato</a>
            </nav>
        </div>
    </header>

    <!-- BANNER DO CATÁLOGO -->
    <section class="catalogo-hero">
        <h1>Catálogo de <span>Produtos e Peças</span></h1>
        <p>Confira nossos produtos disponíveis. Entre em contato diretamente pelo WhatsApp para garantir o seu!</p>
    </section>

    <!-- CONTAINER DOS PRODUTOS -->
    <main class="catalogo-container">
        <div class="produtos-grid" id="gridProdutos">
            <p class="mensagem-status">Carregando catálogo...</p>
        </div>

        <!-- CONTROLES DE PAGINAÇÃO -->
        <div class="paginacao-container" id="controlesPaginacao" style="display: none;">
            <button class="btn-pagina" id="btnAnterior" onclick="mudarPagina(-1)">← Anterior</button>
            <span class="info-pagina" id="infoPagina">Página 1 de 1</span>
            <button class="btn-pagina" id="btnProximo" onclick="mudarPagina(1)">Próximo →</button>
        </div>
    </main>

    <!-- RODAPÉ -->
    <footer>
        <p>&copy; 2025 JC Motos. Todos os direitos reservados.</p>
    </footer>

    <script>
        const escaparHtml = texto => String(texto ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

        let paginaAtual = 1;
        const itensPorPagina = 12;
        let totalPaginasGlobal = 1;

        async function carregarCatalogo(pagina = 1) {
            const grid = document.getElementById('gridProdutos');
            const paginacaoBox = document.getElementById('controlesPaginacao');
            
            grid.innerHTML = '<p class="mensagem-status">Carregando catálogo...</p>';

            try {
                // Requisição paginada para o backend
                const resposta = await fetch(`/api/produtos?page=${pagina}&limit=${itensPorPagina}`);
                if (!resposta.ok) throw new Error('Falha ao conectar com o servidor');
                
                const resultado = await resposta.json();
                const produtos = resultado.produtos || resultado; // Suporte para retorno paginado
                totalPaginasGlobal = resultado.totalPages || 1;
                paginaAtual = pagina;

                if (!produtos || produtos.length === 0) {
                    grid.innerHTML = '<p class="mensagem-status">Nenhum produto cadastrado no momento.</p>';
                    paginacaoBox.style.display = 'none';
                    return;
                }

                grid.innerHTML = produtos.map(p => {
                    const textoWhatsapp = encodeURIComponent(`Olá! Vi o produto "${p.nome}" no catálogo do site por R$ ${p.preco} e gostaria de mais informações.`);
                    const linkWhatsapp = `https://wa.me/5562994613292?text=${textoWhatsapp}`;

                    return `
                        <div class="produto-card">
                            <img src="${escaparHtml(p.imagem_url)}" alt="${escaparHtml(p.nome)}" loading="lazy" onerror="this.src='https://via.placeholder.com/300x200?text=Sem+Imagem'">
                            <div class="produto-info">
                                <div>
                                    <div class="produto-nome">${escaparHtml(p.nome)}</div>
                                    <div class="produto-preco">R$ ${escaparHtml(p.preco)}</div>
                                </div>
                                <a href="${linkWhatsapp}" target="_blank" rel="noopener noreferrer" class="btn-comprar">
                                    <i class="fab fa-whatsapp"></i> Tenho Interesse
                                </a>
                            </div>
                        </div>
                    `;
                }).join('');

                // Atualiza e exibe os botões de paginação se houver mais de 1 página
                if (totalPaginasGlobal > 1) {
                    paginacaoBox.style.display = 'flex';
                    document.getElementById('infoPagina').textContent = `Página ${paginaAtual} de ${totalPaginasGlobal}`;
                    document.getElementById('btnAnterior').disabled = (paginaAtual <= 1);
                    document.getElementById('btnProximo').disabled = (paginaAtual >= totalPaginasGlobal);
                } else {
                    paginacaoBox.style.display = 'none';
                }

            } catch (erro) {
                console.error('Erro ao carregar produtos:', erro);
                grid.innerHTML = '<p class="mensagem-status">Erro ao carregar os produtos. Verifique se o servidor está ativo.</p>';
            }
        }

        function mudarPagina(direcao) {
            const novaPagina = paginaAtual + direcao;
            if (novaPagina >= 1 && novaPagina <= totalPaginasGlobal) {
                carregarCatalogo(novaPagina);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        carregarCatalogo(1);
    </script>
</body>
</html>
